# Memory and undefined-behaviour checks for the compiled code.
#
# This package is the one that most needs them: a hand-written C++/R boundary,
# external pointers with a finalizer, manual PROTECT/UNPROTECT, and an
# exception firewall. A code review caught an unprotected-SEXP bug in the model
# reader that rchk reports statically and gctorture turns from a rare crash
# into a reliable one -- neither of which this repository was running.
on:
  push:
    branches: [main, master]
  pull_request:

name: native-checks

permissions: read-all

jobs:
  # Parked for most of this package's life, and unparked by the trial in #10.
  # It needed two fixes in r-actions, both of them the same mistake in
  # different places: flags that reach CC/CXX and CFLAGS/CXXFLAGS do not reach
  # a package that declares a C++ standard, because R compiles that with
  # $(CXXnn) and $(CXXnnFLAGS). This package declares C++20, so it took the
  # variables nothing was setting.
  #
  # CXXnnSTD is deliberately left alone upstream, on the reasoning that
  # Makeconf's own -std=gnu++nn suits clang++. The trial confirmed it: the
  # compile line came out as `clang++ -std=gnu++20 ... -fsanitize=undefined`.
  # If configure ever reports GMP missing on a runner where GMP is installed,
  # CXXnnSTD is the first thing to suspect.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      # The gcc-asan image compiles with
      # -fsanitize=address,undefined,bounds-strict from its own Makeconf, and
      # bounds-strict is outside the `undefined` group CRAN runs. What it adds
      # is instrumentation of flexible array members and the `T data[0]` idiom
      # that precedes them -- which is how MiniSat allocates a clause, and
      # therefore how most of src/opensmt/ stores its terms:
      #
      #   union { Lit lit; float act; uint32_t abs; CRef rel; } data[0];
      #
      # Measured on GCC 16.2.0, counting emitted __ubsan_handle_out_of_bounds
      # calls for that idiom: 5 under bounds-strict, 0 under -fsanitize=bounds
      # and 0 under -fsanitize=undefined. So these findings are upstream's
      # deliberate design meeting a check CRAN does not run, not a defect
      # this package can fix or should carry a patch rule for.
      #
      # This restores the `undefined` group -- the flavour that can actually
      # reject a submission. It is not a blanket quietening: anything that
      # reproduces under plain -fsanitize=undefined still fails this job, and
      # the ubsan leg above runs that set unmodified.
      gcc-ubsan-flags: -fno-sanitize=bounds-strict

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      # The suite solves a pigeonhole instance, and valgrind is ~20-50x.
      timeout-minutes: 90

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
