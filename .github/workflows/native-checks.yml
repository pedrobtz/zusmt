# Memory and undefined-behaviour checks for the compiled code.
#
# This package is the one that most needs them: a hand-written C++/R boundary,
# external pointers with a finalizer, manual PROTECT/UNPROTECT, and an
# exception firewall. A code review caught an unprotected-SEXP bug in the model
# reader that rchk reports statically and gctorture turns from a rare crash
# into a reliable one -- neither of which this repository was running.
on:
  push:
    branches: [main, master]
  pull_request:

name: native-checks

permissions: read-all

jobs:
  # TRIAL: re-enabled against r-actions@main, which now sets the
  # standard-specific compiler variables this package needed --
  #
  #   CXX11/CXX14/CXX17/CXX20 = clang++   plus their *FLAGS
  #
  # Note the divergence from what the disabled-block below asked for:
  # r-actions sets CXXnnFLAGS but deliberately leaves CXXnnSTD alone, on the
  # reasoning that Makeconf's own -std=gnu++nn suits clang++. This leg is the
  # test of that reasoning. If configure again reports GMP missing on a runner
  # where GMP is installed, CXXnnSTD is why.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@main
    with:
      asan: true

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@main
    with:
      # The suite solves a pigeonhole instance, and valgrind is ~20-50x.
      timeout-minutes: 90

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@main

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@main

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@main
