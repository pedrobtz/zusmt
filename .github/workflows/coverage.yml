# Test coverage, in two parts.
#
# covr measures the R code, which here is a thin layer over the boundary, so
# that number alone would flatter the package. `native: true` adds a gcov
# table for the compiled code, and that is the one worth reading: it says how
# much of the C++ the tests actually reach.
#
# The vendored solver is deliberately not excluded from the native table. A
# low figure there is information -- a bundled library carries modules this
# package never calls -- and hiding it would answer the question by not
# asking it.
on:
  push:
    branches: [main, master]
    # Prevents a push loop: the badge job commits back to the repository.
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:

name: coverage

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@main
    permissions:
      contents: write
    with:
      native: true
      # TRIAL: native-run deliberately removed. r-actions@main now runs each
      # file from inside tests/, which is the fix this override was standing in
      # for. If the native gcov table comes back non-empty without it, the
      # upstream loop is right and this override can go for good.
