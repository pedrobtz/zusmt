# Test coverage, in two parts.
#
# covr measures the R code, which here is a thin layer over the boundary, so
# that number alone would flatter the package. `native: true` adds a gcov
# table for the compiled code, and that is the one worth reading: it says how
# much of the C++ the tests actually reach.
#
# The vendored solver is deliberately not excluded from the native table. A
# low figure there is information -- a bundled library carries modules this
# package never calls -- and hiding it would answer the question by not
# asking it.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "5 21 * * 0"
  workflow_dispatch:
  pull_request:

name: coverage

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: write
    with:
      native: true
      # No native-run override. There used to be one -- `cd tests && Rscript
      # testthat.R` -- because the upstream exercise loop ran `Rscript
      # tests/*.R` from the repository root, where test_check()'s relative
      # test_dir("testthat") finds nothing and reports "No test files found".
      # r-actions runs each file from inside tests/ now, so the override is
      # redundant; dropped and confirmed by a non-empty native gcov table in
      # the trial (#10).
