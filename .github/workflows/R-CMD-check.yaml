# R CMD check, via the reusable workflows in pedrobtz/r-actions.
#
# The file name stays R-CMD-check.yaml because the README badge points at it;
# the workflow's own `name:` is what the GitHub UI shows.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # nold: R built --disable-long-double, which matters for a package whose
      # model values are rationals converted to doubles.
      nold: true

      # nosuggests is off, and it is the leg rather than the package.
      #
      # CRAN builds the tarball once with Suggests available and runs the
      # noSuggests check against that tarball, so vignettes are already built
      # inside it. The r-actions leg instead builds *and* checks inside the
      # nosuggests container, so R CMD build calls loadVignetteBuilder() and
      # dies on "vignette builder 'knitr' not found" before R CMD check is
      # ever reached.
      #
      # The DESCRIPTION arrangement here is the conventional one -- knitr in
      # Suggests, VignetteBuilder: knitr -- and is what CRAN expects.
      #
      # TO RE-ENABLE: once that job passes --no-build-vignettes in its
      # build_args, or exposes them as an input. It currently hardcodes
      # build_args = c("--no-manual"), so nothing here can reach it.
      #
      # It passed in #6 because there was no vignette then; adding one is what
      # exposed the design. Tracked as a Stage 9 item in roadmap.md.
      nosuggests: false
      # --as-cran turns on the bashisms test, which reports a WARNING when the
      # `checkbashisms` script is merely absent -- true of the macOS and
      # Windows runners, where no configure script is even run. With
      # error_on = "warning" that is a red leg saying nothing about this
      # package. The `configure-scripts` job below runs checkbashisms itself,
      # on a machine that has it, so nothing is lost by turning it off here.
      env: |
        _R_CHECK_BASHISMS_=false

  # What the disabled check above would have done, done properly: the real
  # checkbashisms, plus shellcheck in POSIX mode, against every shell script
  # that ships in the tarball.
  configure-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install checkbashisms and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts shellcheck

      - name: checkbashisms
        run: checkbashisms --posix configure configure.win cleanup tools/gmp.sh tools/vendor.sh tools/vendor/verify

      - name: shellcheck
        run: shellcheck -s sh configure configure.win cleanup tools/gmp.sh tools/vendor.sh tools/vendor/verify
